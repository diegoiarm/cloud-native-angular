# Documento 05 - Sesion 2: RabbitMQ Cluster con Docker Compose.
# rabbit@rabbit1 (AMQP 5672 / Management 15672) y rabbit@rabbit2 (AMQP 5673 / Management 15673).
# Ambos nodos deben tener la MISMA Erlang Cookie y nombres distintos.
# La cookie de este archivo es solo de laboratorio; no usarla en produccion.
#
#   docker compose -f infra/docker-compose.cluster.yml up -d
#   docker compose -f infra/docker-compose.cluster.yml ps
#
# El clúster se forma solo al primer arranque (peer discovery en
# rabbitmq-cloud/rabbitmq.conf, el mismo archivo que usa la EC2) y los dos nodos
# arrancan a la vez: RabbitMQ 4 necesita mayoría de nodos para la metadata, y con
# depends_on el primero esperaba al segundo y el clúster no volvía tras un reinicio.
# infra/01_Inicializar_Cluster_Windows.ps1 verifica y solo une a mano si hace falta.
# Para comprobar sin resetear: infra/02_Verificar_Cluster_Windows.ps1
# No dejar levantado el compose single-node (docker-compose.yml): comparte 5672/15672.

services:
  rabbit1:
    image: rabbitmq:4.2-management
    container_name: pedidos360-rabbit1
    hostname: rabbit1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: labuser
      RABBITMQ_DEFAULT_PASS: labpass
      RABBITMQ_ERLANG_COOKIE: Pedidos360LaboratorioCookie
    volumes:
      - ./rabbitmq-cloud/rabbitmq.conf:/etc/rabbitmq/conf.d/90-pedidos360.conf:ro
      - rabbit1_data:/var/lib/rabbitmq
    healthcheck:
      # check_running: healthy solo cuando RabbitMQ terminó de arrancar (ping
      # respondía aunque el nodo siguiera esperando al otro).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 20

  rabbit2:
    image: rabbitmq:4.2-management
    container_name: pedidos360-rabbit2
    hostname: rabbit2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: labuser
      RABBITMQ_DEFAULT_PASS: labpass
      RABBITMQ_ERLANG_COOKIE: Pedidos360LaboratorioCookie
    volumes:
      - ./rabbitmq-cloud/rabbitmq.conf:/etc/rabbitmq/conf.d/90-pedidos360.conf:ro
      - rabbit2_data:/var/lib/rabbitmq
    healthcheck:
      # check_running: healthy solo cuando RabbitMQ terminó de arrancar (ping
      # respondía aunque el nodo siguiera esperando al otro).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  rabbit1_data:
  rabbit2_data:
