# =============================================================================
# Pedidos360 - AWS API Gateway (HTTP API) delante de los microservicios en EC2
#
# Flujo: Angular + MSAL (Access Token) -> API Gateway (JWT Authorizer) -> EC2 (pedidos-api / catalogo-api) -> RDS
#
# Los endpoints /api/catalog/stock/* NO se publican: solo los llama pedidos-api internamente.
#
# Para publicar:
#   1) API Gateway -> Create API -> HTTP API -> Import -> subir este archivo.
#   2) Reemplazar TU-EC2-DNS (pedidos-api) y TU-EC2-CATALOGO-DNS (catalogo-api)
#      por el DNS/IP de cada instancia EC2.
#   3) Reemplazar TU-DOMINIO en CORS por el dominio real del frontend.
#   4) Crear el stage "prod" con auto-deploy.
#
# API Gateway valida firma, issuer, audience y scope; Spring Security vuelve a
# validar el token y además aplica la autorización por App Roles.
# =============================================================================
openapi: "3.0.1"
info:
  title: pedidos360-api
  description: Punto de entrada a pedidos-api. Valida JWT de Microsoft Entra ID.
  version: "1.0.0"

x-amazon-apigateway-cors:
  allowOrigins:
    - "http://localhost:4200"
    - "https://TU-DOMINIO.vercel.app"
  allowMethods:
    - GET
    - POST
    - PUT
    - OPTIONS
  allowHeaders:
    - Authorization
    - Content-Type
  maxAge: 600

paths:
  /api/publico:
    get:
      summary: Endpoint público (200 sin token)
      responses:
        "200":
          description: Respuesta pública
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://TU-EC2-DNS:8080/api/publico"
        payloadFormatVersion: "1.0"

  /api/orders:
    get:
      summary: Lista pedidos (Cliente solo los suyos)
      security:
        - EntraJwtAuthorizer:
            - Pedidos.Read
      responses:
        "200":
          description: OK
        "401":
          description: Sin token o token inválido
        "403":
          description: Sin scope Pedidos.Read o sin App Role (Spring)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://TU-EC2-DNS:8080/api/orders"
        payloadFormatVersion: "1.0"
    post:
      summary: Crea un pedido (Cliente u Operador)
      security:
        - EntraJwtAuthorizer:
            - Pedidos.Read
      responses:
        "201":
          description: OK
        "401":
          description: Sin token o token inválido
        "403":
          description: Sin scope Pedidos.Read o sin App Role (Spring)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://TU-EC2-DNS:8080/api/orders"
        payloadFormatVersion: "1.0"

  /api/orders/{id}:
    get:
      summary: Detalle de un pedido
      security:
        - EntraJwtAuthorizer:
            - Pedidos.Read
      responses:
        "200":
          description: OK
        "401":
          description: Sin token o token inválido
        "403":
          description: Sin scope Pedidos.Read o sin App Role (Spring)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://TU-EC2-DNS:8080/api/orders/{id}"
        payloadFormatVersion: "1.0"

  /api/orders/{id}/status:
    put:
      summary: Cambia el estado (Operador o Admin)
      security:
        - EntraJwtAuthorizer:
            - Pedidos.Read
      responses:
        "200":
          description: OK
        "401":
          description: Sin token o token inválido
        "403":
          description: Sin scope Pedidos.Read o sin App Role (Spring)
        "409":
          description: Transición inválida o stock insuficiente
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        uri: "http://TU-EC2-DNS:8080/api/orders/{id}/status"
        payloadFormatVersion: "1.0"

  # Alias de compatibilidad con la guía del curso (mismo listado que /api/orders).
  /api/pedidos:
    get:
      summary: Lista pedidos (alias de /api/orders)
      security:
        - EntraJwtAuthorizer:
            - Pedidos.Read
      responses:
        "200":
          description: OK
        "401":
          description: Sin token o token inválido
        "403":
          description: Sin scope Pedidos.Read o sin App Role (Spring)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://TU-EC2-DNS:8080/api/pedidos"
        payloadFormatVersion: "1.0"

  # ---- catalogo-api (EC2, puerto 8081) ----
  /api/catalog/products:
    get:
      summary: Lista productos (los tres roles)
      security:
        - EntraJwtAuthorizer:
            - Pedidos.Read
      responses:
        "200":
          description: OK
        "401":
          description: Sin token o token inválido
        "403":
          description: Sin scope Pedidos.Read o sin App Role (Spring)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://TU-EC2-CATALOGO-DNS:8081/api/catalog/products"
        payloadFormatVersion: "1.0"
    post:
      summary: Crea producto (Admin)
      security:
        - EntraJwtAuthorizer:
            - Pedidos.Read
      responses:
        "201":
          description: OK
        "401":
          description: Sin token o token inválido
        "403":
          description: Sin scope Pedidos.Read o sin App Role (Spring)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://TU-EC2-CATALOGO-DNS:8081/api/catalog/products"
        payloadFormatVersion: "1.0"

  /api/catalog/products/{id}:
    get:
      summary: Detalle de producto
      security:
        - EntraJwtAuthorizer:
            - Pedidos.Read
      responses:
        "200":
          description: OK
        "401":
          description: Sin token o token inválido
        "403":
          description: Sin scope Pedidos.Read o sin App Role (Spring)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://TU-EC2-CATALOGO-DNS:8081/api/catalog/products/{id}"
        payloadFormatVersion: "1.0"
    put:
      summary: Edita precio y stock (Admin)
      security:
        - EntraJwtAuthorizer:
            - Pedidos.Read
      responses:
        "200":
          description: OK
        "401":
          description: Sin token o token inválido
        "403":
          description: Sin scope Pedidos.Read o sin App Role (Spring)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        uri: "http://TU-EC2-CATALOGO-DNS:8081/api/catalog/products/{id}"
        payloadFormatVersion: "1.0"

  /api/me:
    get:
      summary: Claims del token validado por Spring Security
      security:
        - EntraJwtAuthorizer: []
      responses:
        "200":
          description: Claims y authorities
        "401":
          description: Sin token o token inválido
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://TU-EC2-DNS:8080/api/me"
        payloadFormatVersion: "1.0"

components:
  securitySchemes:
    EntraJwtAuthorizer:
      type: oauth2
      flows: {}
      x-amazon-apigateway-authorizer:
        type: jwt
        identitySource: "$request.header.Authorization"
        jwtConfiguration:
          issuer: "https://login.microsoftonline.com/6bf42f50-ccc9-46e4-ae46-2b6534675957/v2.0"
          audience:
            - "371e0368-c37d-4768-9266-0212824e67ba"
