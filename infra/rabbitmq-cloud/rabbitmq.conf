# Configuración de los dos nodos en la EC2 (EP4).
#
# El clúster se forma solo al primer arranque: cada nodo conoce la lista de
# miembros y se une al otro, sin join_cluster manual. Ambos nodos arrancan a la
# vez (sin depends_on), porque RabbitMQ 4 necesita mayoría de nodos para la
# metadata: con 2 nodos son los 2, y uno solo no termina de arrancar.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Memoria acotada: la instancia comparte RAM con tres servicios Java.
# Con el watermark por defecto (0.6), RabbitMQ frena a los producers sobre ~240 MB.
total_memory_available_override_value = 400MB
