server:
  port: 8080

spring:
  application:
    name: pedidos-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidosdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
  rabbitmq:
    # Documento 05, Paso 4: la aplicación se conecta a los dos nodos del clúster
    # (rabbit1 en 5672 y rabbit2 en 5673). El cliente usa la primera dirección
    # disponible, así que también sirve con el broker single-node de docker-compose.yml.
    # En cloud se sobrescribe con RABBITMQ_ADDRESSES o con RABBITMQ_HOST/RABBITMQ_PORT.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:labuser}
    password: ${RABBITMQ_PASSWORD:labpass}
    listener:
      simple:
        # Los consumers de Pedidos360 confirman a mano (ackMode = "MANUAL" en cada
        # @RabbitListener): basicAck al procesar, basicNack sin requeue al agotar intentos.
        # Para cualquier otro listener, un rechazo tampoco vuelve a la cola: el DLX
        # de la cola principal lo conduce a la DLQ, nunca a un bucle de requeue.
        default-requeue-rejected: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID:6bf42f50-ccc9-46e4-ae46-2b6534675957}/v2.0
          jwk-set-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID:6bf42f50-ccc9-46e4-ae46-2b6534675957}/discovery/v2.0/keys
          # Solo se aceptan tokens emitidos para la API (App_DSY1107_API).
          audiences:
            - ${ENTRA_API_CLIENT_ID:371e0368-c37d-4768-9266-0212824e67ba}
            - api://${ENTRA_API_CLIENT_ID:371e0368-c37d-4768-9266-0212824e67ba}

# Microservicio de catálogo (precios y stock). Pedidos lo llama reenviando el token del usuario.
catalogo:
  url: ${CATALOGO_URL:http://localhost:8081}

# Orígenes permitidos por CORS, separados por coma.
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
