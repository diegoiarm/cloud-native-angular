# Perfil de pruebas: H2 en memoria, no requiere la base cloud.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Las pruebas no levantan un broker: el producer se simula con @MockitoBean y los
# consumers no arrancan. El enrutamiento real se verifica en la sesión con el broker.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
