<header class="barra">
  <div class="marca">Pedidos360</div>

  <nav *ngIf="user">
    <a routerLink="/dashboard" routerLinkActive="activo">Dashboard</a>
    <a routerLink="/orders" routerLinkActive="activo">Pedidos</a>
    <a routerLink="/catalog" routerLinkActive="activo">Catálogo</a>
  </nav>

  <div class="usuario" *ngIf="user">
    <span>{{ user.name }}</span>
    <button (click)="logout()">Cerrar sesión</button>
  </div>

  <a *ngIf="!user" routerLink="/login">Iniciar sesión</a>
</header>

<main class="contenedor">
  <router-outlet></router-outlet>
</main>
