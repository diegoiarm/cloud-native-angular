<header class="barra">
  <a class="marca" routerLink="/dashboard">Pedidos360</a>

  <nav *ngIf="user" aria-label="Secciones">
    <a routerLink="/dashboard" routerLinkActive="activo">Dashboard</a>
    <a routerLink="/orders" routerLinkActive="activo">Pedidos</a>
    <a routerLink="/catalog" routerLinkActive="activo">Catálogo</a>
  </nav>

  <div class="usuario" *ngIf="user">
    <div class="identidad">
      <span class="nombre">{{ user.name }}</span>
      <span class="cuenta">{{ user.username }}</span>
    </div>
    <span class="rol" *ngIf="rol" [title]="'Rol asignado en Entra ID'">{{ rol }}</span>
    <button type="button" class="secundario" (click)="logout()">Cerrar sesión</button>
  </div>

  <a *ngIf="!user" class="ingresar" routerLink="/login">Iniciar sesión</a>
</header>

<main class="contenedor">
  <router-outlet></router-outlet>
</main>
