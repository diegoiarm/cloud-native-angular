# Laboratorio Kafka local de la Semana 12 (documento 03).
#
# Un solo nodo KRaft que cumple a la vez los roles broker + controller, y
# Kafbat UI para observar topics, particiones, offsets y grupos.
#
#   Kafka desde Windows : localhost:9092
#   Kafka entre Docker  : kafka:9093   (lo usa la UI; NO usar localhost:9092)
#   Kafbat UI           : http://localhost:8090
#
# Uso:
#   docker compose -f kafka-lab/compose.yaml up -d
#   docker compose -f kafka-lab/compose.yaml ps
#   docker compose -f kafka-lab/compose.yaml stop / start
#
# NO usar "docker compose down" como pausa habitual: este laboratorio no declara
# persistencia garantizada y al recrear el contenedor se pueden perder topics.

services:
  kafka:
    image: apache/kafka:4.2.2
    container_name: pedidos360-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # Formato KRaft: el mismo CLUSTER_ID en todos los nodos del cluster.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # EXTERNAL: clientes del host. INTERNAL: UI y contenedores. CONTROLLER: quorum.
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:9093,CONTROLLER://:9095
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9095
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: pedidos360-kafka-ui
    ports:
      # Puerto interno del contenedor 8080; en el host queda en 8090.
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: DSY1107-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_READONLY: "false"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka_data:
